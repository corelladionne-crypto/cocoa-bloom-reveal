name: Finish persistent tree flow

on:
  push:
    paths:
      - '.github/workflows/finish-persistent-tree.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch 24 hour live countdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          s = s.replace('export const GROWTH_DURATION_HOURS = 36;', 'export const GROWTH_DURATION_HOURS = 24;')
          s = s.replace('window.setInterval(() => setNow(Date.now()), 30000)', 'window.setInterval(() => setNow(Date.now()), 1000)')
          s = s.replace('const minutes = Math.floor((next % 3600000) / 60000);', 'const minutes = Math.floor((next % 3600000) / 60000);\n  const seconds = Math.floor((next % 60000) / 1000);')
          s = s.replace('`${hours}h ${minutes}m until the next stage`', '`${String(hours).padStart(2, "0")}h ${String(minutes).padStart(2, "0")}m ${String(seconds).padStart(2, "0")}s remaining`')
          s = s.replace('function LivingTree({ tree }: { tree: TreeRecord }) {', 'export function LivingTree({ tree }: { tree: TreeRecord }) {')
          p.write_text(s)
          PY
      - name: Regenerate TanStack route tree
        run: |
          npm install
          npx tsr generate
      - name: Verify TypeScript and build
        run: |
          npx tsc --noEmit
          npm run build
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routeTree.gen.ts
          git commit -m "Use 24 hour live tree growth countdown"
          git rm .github/workflows/finish-persistent-tree.yml
          git commit -m "Remove one-time tree setup workflow"
          git push
