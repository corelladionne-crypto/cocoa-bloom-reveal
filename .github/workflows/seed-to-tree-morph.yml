name: Seed to tree morph

on:
  push:
    paths:
      - '.github/workflows/seed-to-tree-morph.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Grow screen with seed-to-tree morph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()

          # The seed belongs to the Grow animation itself; don't render the old global overlay there.
          s = s.replace('{step >= 2 && step <= 4 && seedPhase !== "hidden" ?', '{step >= 2 && step <= 3 && seedPhase !== "hidden" ?')

          start = s.index('function GrowScreen({')
          end = s.index('\nfunction ThankYouScreen', start)

          new = r'''function GrowScreen({
  name,
  setName,
  rooted,
  onSubmit,
}: {
  name: string;
  setName: (v: string) => void;
  rooted: boolean;
  onSubmit: (e: React.FormEvent) => void;
}) {
  const [growthStage, setGrowthStage] = useState<0 | 1 | 2 | 3>(0);

  useEffect(() => {
    const t1 = window.setTimeout(() => setGrowthStage(1), 1800);
    const t2 = window.setTimeout(() => setGrowthStage(2), 4200);
    const t3 = window.setTimeout(() => setGrowthStage(3), 7000);
    return () => {
      window.clearTimeout(t1);
      window.clearTimeout(t2);
      window.clearTimeout(t3);
    };
  }, []);

  const treeVisible = growthStage >= 1;
  const seedVisible = growthStage < 3;

  return (
    <section className="relative flex h-full w-full flex-col overflow-hidden bg-plum px-8 pb-10 pt-16">
      <div className="shrink-0"><ChangingFuturesMark /></div>

      <div className="relative mt-2 flex h-[255px] shrink-0 items-end justify-center overflow-visible">
        <div className="absolute bottom-0 left-0 right-0 h-24"><KraftSoil className="h-full" /></div>

        {/* The tree grows from the exact point where the seed is sitting. */}
        <img
          src={cocoaTree}
          alt="Gold line drawing of a growing cocoa tree"
          className="absolute bottom-0 left-1/2 z-10 w-72 -translate-x-1/2 origin-bottom object-contain"
          style={{
            opacity: treeVisible ? 1 : 0,
            transform: treeVisible
              ? 'translateX(-50%) scale(1)'
              : 'translateX(-50%) scale(.02)',
            clipPath: treeVisible
              ? 'inset(0 0 0 0)'
              : 'inset(100% 0 0 0)',
            filter: treeVisible
              ? 'drop-shadow(0 0 30px rgba(233,194,90,.4))'
              : 'none',
            transition: `opacity 1800ms ${SOFT}, transform 3600ms ${SOFT}, clip-path 3600ms ${SOFT}, filter 1800ms ${SOFT}`,
          }}
        />

        {/* The seed doesn't switch off abruptly. It enlarges toward the emerging tree,
            then dissolves into it so the two assets read as one continuous transformation. */}
        <div
          aria-hidden
          className="absolute bottom-[48px] left-1/2 z-20 -translate-x-1/2"
          style={{
            opacity: seedVisible ? 1 : 0,
            transform: seedVisible
              ? growthStage === 0
                ? 'translateX(-50%) scale(1)'
                : growthStage === 1
                  ? 'translateX(-50%) scale(1.16)'
                  : 'translateX(-50%) scale(1.55)'
              : 'translateX(-50%) scale(2.05)',
            filter: growthStage >= 1 ? 'blur(1px)' : 'blur(0)',
            transition: `opacity 1500ms ${SOFT}, transform 3000ms ${SOFT}, filter 1500ms ${SOFT}`,
          }}
        >
          <img
            src={cocoaSeed}
            alt=""
            className="w-24 object-contain drop-shadow-[0_0_24px_rgba(233,194,90,.4)]"
          />
        </div>

        {/* A soft gold bridge makes the seed visually flow into the trunk rather than pop away. */}
        <div
          aria-hidden
          className="absolute bottom-[46px] left-1/2 z-[15] h-20 w-16 -translate-x-1/2 rounded-full bg-gold/20 blur-xl"
          style={{
            opacity: growthStage >= 1 && growthStage < 3 ? 1 : 0,
            transform: growthStage >= 2 ? 'translateX(-50%) scale(1.8, 2.8)' : 'translateX(-50%) scale(.7, 1)',
            transition: `opacity 1200ms ${SOFT}, transform 2400ms ${SOFT}`,
          }}
        />
      </div>

      <form onSubmit={onSubmit} className="relative z-30 mt-2">
        <h2 className="text-6xl font-bold leading-none text-gold-soft" style={{ fontFamily: BODONI }}>Grow</h2>
        <span className="mt-2 block text-xl italic text-gold/70" style={{ fontFamily: BODONI }}>Changing Futures</span>
        <p className="mt-3 max-w-[19rem] text-[15px] italic leading-relaxed text-foreground/80" style={{ fontFamily: GARAMOND }}>
          The world ahead doesn’t look like the one behind it. Changing Futures is ASU’s commitment to build what doesn’t exist yet — because it has to. Tonight, you’re part of that.
        </p>
        <label className="mt-3 block text-[11px] font-bold uppercase tracking-[0.3em] text-foreground/60" style={{ fontFamily: HAAS }}>
          Name
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Name your tree" className="mt-2 w-full rounded-xl border border-gold/40 bg-plum-deep/60 px-4 py-3 text-base font-normal normal-case tracking-normal text-foreground outline-none transition-colors focus:border-gold" style={{ fontFamily: GARAMOND }} />
        </label>
        <button type="submit" className="mt-4 w-full rounded-full bg-gold px-6 py-4 text-sm font-bold uppercase tracking-[0.2em] text-plum-deep transition-transform duration-300 ease-spring hover:scale-[1.03] active:scale-95" style={{ fontFamily: HAAS }}>Root my tree</button>
      </form>
    </section>
  );
}
'''
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/seed-to-tree-morph.yml
          git commit -m "Make seed flow directly into growing tree"
          git rm .github/workflows/seed-to-tree-morph.yml
          git commit -m "Remove one-time seed morph workflow"
          git push
